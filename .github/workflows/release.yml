name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
        default: 'patch'
      release_notes:
        description: 'Release notes (optional changelog entry)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (skip npm publish and git push)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_NODE_VERSION: '24.14.1'

jobs:
  # Run unit tests first
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

  # Run Solana unit tests
  solana-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Solana unit tests
        run: pnpm test:solana

  # Run fork tests for each chain
  fork-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chain: [base, base-sepolia, arbitrum, bsc]
        include:
          - chain: base
            chain_id: 8453
          - chain: base-sepolia
            chain_id: 84532
          - chain: arbitrum
            chain_id: 42161
          - chain: bsc
            chain_id: 56
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify Anvil installation
        run: anvil --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fork tests for ${{ matrix.chain }}
        run: pnpm test:fork
        env:
          ANVIL_FORK_ENABLED: 'true'
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TEST_CHAIN: ${{ matrix.chain }}
        timeout-minutes: 15

  # Run whitelisting tests (live, rate-limited)
  whitelisting-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chain: [base, base-sepolia, arbitrum, bsc, mainnet, monad-mainnet, robinhood]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run whitelisting tests for ${{ matrix.chain }}
        run: pnpm test:live
        env:
          LIVE_TEST_ENABLED: 'true'
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TEST_CHAINS: ${{ matrix.chain }}
        timeout-minutes: 10

  # Release job runs after tests pass
  release:
    runs-on: ubuntu-latest
    needs: [unit-tests, solana-tests, fork-tests, whitelisting-tests]
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Log Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          RELEASE_TYPE="${{ inputs.release_type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT%%-*}"

          case "$RELEASE_TYPE" in
            patch)
              if [[ "$CURRENT" == *-* ]]; then
                NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              else
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              fi
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            rc)
              if [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
                NEW_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-rc.$((BASH_REMATCH[4] + 1))"
              else
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-rc.0"
              fi
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Determine dist-tags
        id: dist_tags
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"

          if [[ "$VERSION" == *-* ]]; then
            echo "primary_tag=rc" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "secondary_tag=" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update package.json version
        run: npm version "${{ steps.new_version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        if: ${{ inputs.dry_run != true }}
        run: |
          git add package.json
          if [ -n "${{ inputs.release_notes }}" ]; then
            git commit -m "chore(release): v${{ steps.new_version.outputs.version }}

          ${{ inputs.release_notes }}"
          else
            git commit -m "chore(release): v${{ steps.new_version.outputs.version }}"
          fi

      - name: Create git tag
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "${{ inputs.release_notes }}" ]; then
            git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}

          ${{ inputs.release_notes }}"
          else
            git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"
          fi

      - name: Push changes and tag
        if: ${{ inputs.dry_run != true }}
        run: |
          git push origin main
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Publish to NPM
        if: ${{ inputs.dry_run != true }}
        run: |
          PRIMARY_TAG="${{ steps.dist_tags.outputs.primary_tag }}"
          SECONDARY_TAG="${{ steps.dist_tags.outputs.secondary_tag }}"

          # Trusted publishing uses OIDC - provenance is automatic
          npm publish --access public --tag "$PRIMARY_TAG"

          if [ -n "$SECONDARY_TAG" ]; then
            npm dist-tag add "@whetstone-research/doppler-sdk@${{ steps.new_version.outputs.version }}" "$SECONDARY_TAG"
          fi

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "=== DRY RUN ==="
          echo "Would publish version: ${{ steps.new_version.outputs.version }}"
          echo "Primary tag: ${{ steps.dist_tags.outputs.primary_tag }}"
          echo "Secondary tag: ${{ steps.dist_tags.outputs.secondary_tag }}"
          npm pack --dry-run

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: v${{ steps.new_version.outputs.version }}
          prerelease: ${{ steps.dist_tags.outputs.is_prerelease == 'true' }}
          body: |
            ${{ inputs.release_notes }}

            ## Install
            ```bash
            npm install @whetstone-research/doppler-sdk@${{ steps.new_version.outputs.version }}
            ```
          generate_release_notes: true
          append_body: true

      - name: Job summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.new_version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.dist_tags.outputs.primary_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | \`v${{ steps.new_version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
